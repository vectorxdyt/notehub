<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#485047"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">Angles in a circle</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">Central angle = 2 × inscribed angle</text><text x="48" y="200" font-size="15">Same arc. Different perspectives.</text><text x="48" y="243" font-size="15">∠AOB = 2∠ACB</text><text x="48" y="286" font-size="15">A full turn is 360°.</text><circle cx="565" cy="217" r="94" fill="none" stroke="#e5e8d2" stroke-width="2.5"/><path d="M490 274L565 217L641 274M490 274L555 124L641 274" fill="none" stroke="#daddc7" stroke-width="2"/><circle cx="565" cy="217" r="3" fill="#e4d890"/><text x="573" y="210" font-size="18" fill="#e4d890">O</text></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>