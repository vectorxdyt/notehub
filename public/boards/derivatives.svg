<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#35463f"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">The derivative</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">f′(x) = lim  [f(x + h) − f(x)] / h</text><text x="48" y="200" font-size="15">As h → 0, the secant becomes a tangent.</text><text x="48" y="243" font-size="15">f(x) = x²     →     f′(x) = 2x</text><text x="48" y="286" font-size="15">At x = 2, the slope is 4.</text><path d="M450 110V320M395 270H680" stroke="#c7d2bf" stroke-width="1.5" opacity=".55"/><path d="M420 285 Q540 285 650 120" fill="none" stroke="#e6e9d9" stroke-width="3"/><path d="M470 310L670 120" stroke="#e2d794" stroke-width="2"/></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>