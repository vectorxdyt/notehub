<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#3d4c43"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">A little probability</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">P(A) = favorable outcomes / all outcomes</text><text x="48" y="200" font-size="15">Rolling an even number:  {2, 4, 6}</text><text x="48" y="243" font-size="15">P(even) = 3 / 6 = 1 / 2</text><text x="48" y="286" font-size="15">For independent events: P(A ∩ B) = P(A)P(B)</text><rect x="490" y="150" width="130" height="130" rx="12" fill="none" stroke="#e0e6cd" stroke-width="2.5"/><circle cx="520" cy="180" r="7" fill="#d9dfc6"/><circle cx="590" cy="180" r="7" fill="#d9dfc6"/><circle cx="520" cy="215" r="7" fill="#d9dfc6"/><circle cx="590" cy="215" r="7" fill="#d9dfc6"/><circle cx="520" cy="250" r="7" fill="#d9dfc6"/><circle cx="590" cy="250" r="7" fill="#d9dfc6"/></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>