<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#30433b"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">Quadratic functions</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">y = ax² + bx + c</text><text x="48" y="200" font-size="15">Vertex form:  y = a(x − h)² + k</text><text x="48" y="243" font-size="15">Vertex = (h, k)</text><text x="48" y="286" font-size="15">Axis of symmetry:  x = −b / 2a</text><path d="M450 110V320M395 270H680" stroke="#c7d2bf" stroke-width="1.5" opacity=".55"/><path d="M475 130 Q560 420 650 130" fill="none" stroke="#eeeacb" stroke-width="3"/><circle cx="562" cy="276" r="4" fill="#e4d890"/><text x="582" y="310" font-size="18" fill="#e4d890">(h, k)</text></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>