<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#46504b"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">Finding the roots</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">x² − 5x + 6 = 0</text><text x="48" y="200" font-size="15">(x − 2)(x − 3) = 0</text><text x="48" y="243" font-size="15">x = 2  or  x = 3</text><text x="48" y="286" font-size="15">Check:  4 − 10 + 6 = 0</text><text x="470" y="195" font-size="30" fill="#e3d992">x = 2</text><text x="470" y="255" font-size="30" fill="#e3d992">x = 3</text></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>