<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#384940"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">Systems of equations</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">2x + y = 8</text><text x="48" y="200" font-size="15">x − y = 1</text><text x="48" y="243" font-size="15">Add the equations:  3x = 9</text><text x="48" y="286" font-size="15">x = 3,  y = 2</text><path d="M450 110V320M395 270H680" stroke="#c7d2bf" stroke-width="1.5" opacity=".55"/><path d="M425 310L650 155M450 110L650 300" stroke="#e8e8d2" stroke-width="3"/><circle cx="547" cy="225" r="5" fill="#e6d891"/><text x="559" y="220" font-size="18" fill="#e4d890">(3, 2)</text></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>