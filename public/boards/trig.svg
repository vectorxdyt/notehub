<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><rect width="760" height="480" fill="#394b43"/><g font-family="Georgia,serif" fill="#e3e8d6"><text x="48" y="75" font-size="27">Right triangle ratios</text><path d="M48 94H350" stroke="#cbd3b9" stroke-width="1" opacity=".5"/><text x="48" y="147" font-size="22" fill="#e2d8a2">sin θ = opposite / hypotenuse</text><text x="48" y="200" font-size="15">cos θ = adjacent / hypotenuse</text><text x="48" y="243" font-size="15">tan θ = opposite / adjacent</text><text x="48" y="286" font-size="15">SOH  ·  CAH  ·  TOA</text><path d="M465 280H670V120Z" fill="none" stroke="#e9ebd6" stroke-width="3"/><path d="M650 280V260H670M500 280Q500 263 490 260" fill="none" stroke="#d7d298" stroke-width="2"/><text x="508" y="267" font-size="20" fill="#e4d890">θ</text><text x="540" y="311" font-size="17" fill="#d7ddcb">adjacent</text><text x="560" y="172" font-size="17" fill="#d7ddcb" transform="rotate(-38 560 172)">hypotenuse</text></g><text x="48" y="433" fill="#d0d9c4" opacity=".45" font-family="sans-serif" font-size="10" letter-spacing="2">NOTEHUB / EXAMPLE BOARD</text><path d="M0 464H760" stroke="#23392e" stroke-width="16"/><path d="M540 459H590" stroke="#d9d9c8" stroke-width="5" stroke-linecap="round"/></svg>